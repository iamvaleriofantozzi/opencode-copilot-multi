services:
  opencode-copilot-multi:
    build: .
    ports:
      - "3001:3001"
    restart: always
    env_file:
      - .env
    environment:
      - ACCOUNTS_POOL_PATH=/app/pool.json
    volumes:
      - /Users/valeriofantozzi/.local/share/opencode/copilot-multi-accounts.json:/app/pool.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
